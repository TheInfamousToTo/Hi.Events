name: Tap fork - test and publish image

on:
  push:
    branches: [tap-payments]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hievents_test
          POSTGRES_USER: hievents
          POSTGRES_PASSWORD: hievents
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hievents -d hievents_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: hievents_test
      DB_USERNAME: hievents
      DB_PASSWORD: hievents
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_pgsql, pgsql, tokenizer, gd
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate && php artisan jwt:secret --force
      - name: Syntax check changed PHP
        run: find app database routes tests -name '*.php' -newer composer.json -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Migrations apply cleanly (incl. tap_payments)
        run: php artisan migrate --force
      - name: Unit tests
        run: php artisan test --testsuite=Unit

  frontend-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: corepack enable && yarn install --frozen-lockfile --network-timeout 600000
      # Upstream does not gate on tsc, so only fail on errors in files this fork touches.
      - name: Typecheck fork changes
        run: |
          npx tsc --noEmit -p . > tsc.log || true
          if grep -E "src/(components/routes/product-widget/Payment/index.tsx|api/order.client.ts|components/routes/event/Settings/Sections/PaymentSettings/index.tsx|utilites/orderHelper.ts|types.ts)" tsc.log; then
            echo "::error::TypeScript errors in Tap fork files"; exit 1; fi

  image:
    needs: [backend-tests, frontend-typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.all-in-one
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/theinfamoustoto/hi.events-all-in-one:tap-${{ github.sha }}
            ghcr.io/theinfamoustoto/hi.events-all-in-one:tap
          cache-from: type=gha
          cache-to: type=gha,mode=max
